<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>皇室德州</title>
  <meta name="theme-color" content="#0a1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="皇室德州" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- ===== 大厅主页 ===== -->
    <section id="screen-home" class="screen">
      <header class="lobby-top">
        <div class="brand"><span class="brand-mark">♠</span><span class="brand-name">皇室德州</span>
          <span class="lvl-chip" id="level-info">Lv.1<span class="lvl-bar"><i id="level-bar"></i></span></span></div>
        <div class="wallet">
          <span class="cur coins"><i>🪙</i><b class="coin-val">0</b></span>
          <span class="cur diamonds"><i>💎</i><b class="diamond-val">0</b></span>
        </div>
      </header>
      <main class="lobby-scroll">
        <section class="profile-strip">
          <div class="profile-avatar"><img id="home-avatar" src="assets/av/1.png" alt="" /></div>
          <div class="profile-main">
            <div class="profile-name">皇家玩家 <span id="home-title">德州新秀</span></div>
            <div class="profile-stats">
              <span id="home-hands">0手</span>
              <span id="home-winrate">胜率 0%</span>
              <span id="home-pot">最大底池 0</span>
            </div>
          </div>
          <button class="mini-btn" data-panel="profile">资料</button>
        </section>

        <section class="status-deck">
          <button class="status-card" data-panel="vip">
            <span>VIP</span><b id="home-vip">0</b><em id="home-vip-next">距 VIP1 还差 20局</em>
            <i><u id="home-vip-bar"></u></i>
          </button>
          <button class="status-card" data-panel="season">
            <span>赛季</span><b id="home-season">青铜 I</b><em id="home-season-next">Lv.1 / 50</em>
            <i><u id="home-season-bar"></u></i>
          </button>
          <button class="status-card" data-panel="security">
            <span>牌局安全</span><b>公平</b><em>本地洗牌可审计</em>
            <i><u style="width:86%"></u></i>
          </button>
        </section>

        <section class="hero">
          <div class="hero-copy">
            <div class="hero-kicker">SEASON 08</div>
            <div class="hero-title">皇室德州</div>
            <div class="hero-sub">ROYAL HOLD'EM CLUB</div>
          </div>
          <div class="hero-logo">♠</div>
        </section>

        <section class="event-banner" data-panel="season">
          <div>
            <b>皇家赛季开启</b>
            <span>完成牌局、连胜与签到任务，解锁钻石、称号和场景奖励。</span>
          </div>
          <button class="mini-btn">查看</button>
        </section>

        <section class="ops-strip">
          <button data-panel="events"><b>限时活动</b><span>首胜加奖</span></button>
          <button data-panel="gifts"><b>牌桌礼物</b><span>互动特效</span></button>
          <button data-panel="coach"><b>训练营</b><span>胜率教练</span></button>
        </section>

        <section class="liveops-board">
          <div class="panel-title"><span>成长与活动</span><button data-panel="activityMap">总览</button></div>
          <div class="liveops-grid">
            <button data-panel="passport"><span>通行证</span><b>皇家征程</b><em>50 级成长奖励</em></button>
            <button data-panel="mysteryShop"><span>特惠</span><b>秘宝商店</b><em>外观折扣轮换</em></button>
            <button data-panel="goldenPig"><span>储蓄</span><b>金库钱罐</b><em>活跃累计金币</em></button>
            <button data-panel="invite"><span>社交</span><b>邀请礼</b><em>好友入桌奖励</em></button>
          </div>
        </section>

        <section class="mode-grid">
          <button class="mode-card main-mode" id="btn-play">
            <span class="mode-ic">♠</span>
            <b>经典牌桌</b>
            <em>单机 AI · 多难度 · 练牌</em>
          </button>
          <a class="mode-card online-mode" id="btn-online" href="online.html">
            <span class="mode-ic">👥</span>
            <b>真人对战</b>
            <em>WebSocket 联机牌桌</em>
          </a>
          <button class="mode-card" data-panel="tourney">
            <span class="mode-ic">🏆</span>
            <b>锦标赛</b>
            <em>限时排名奖励</em>
          </button>
        </section>

        <section class="lobby-panel">
          <div class="panel-title"><span>今日事务</span><button data-panel="notice">公告</button></div>
          <div class="task-list">
            <button class="task-row" id="home-task-checkin">
              <span>🎁</span><b>每日签到</b><em>可领取金币和钻石</em><i id="checkin-dot" class="dot hidden"></i>
            </button>
            <button class="task-row" id="home-task-wheel">
              <span>🎡</span><b>幸运转盘</b><em>每天免费抽一次</em><i id="wheel-dot" class="dot hidden"></i>
            </button>
            <button class="task-row" data-panel="missions">
              <span>📋</span><b>每日任务</b><em id="home-mission-line">完成 3 个目标领宝箱</em>
            </button>
          </div>
        </section>

        <nav class="app-grid">
          <button id="btn-shop"><span>🛒</span><b>商店</b></button>
          <button id="btn-redeem"><span>🎟️</span><b>礼包</b></button>
          <button data-panel="rank"><span>🏅</span><b>排行</b></button>
          <button data-panel="mail"><span>✉️</span><b>邮件</b></button>
          <button data-panel="club"><span>🏛️</span><b>俱乐部</b></button>
          <button data-panel="vault"><span>💼</span><b>保险箱</b></button>
          <button data-panel="vip"><span>👑</span><b>贵宾</b></button>
          <button data-panel="achievements"><span>🎖️</span><b>成就</b></button>
          <button data-panel="friends"><span>🤝</span><b>好友</b></button>
          <button data-panel="analytics"><span>📊</span><b>数据</b></button>
          <button data-panel="support"><span>🎧</span><b>客服</b></button>
          <button data-panel="settings"><span>⚙️</span><b>设置</b></button>
          <button id="btn-sound"><span id="sound-icon">🔊</span><b>音效</b></button>
        </nav>
      </main>
    </section>

    <!-- ===== 选桌 / 选规则 ===== -->
    <section id="screen-select" class="screen hidden">
      <header class="sub-top">
        <button class="back-btn" id="btn-select-back">‹ 返回</button>
        <span class="sub-title">选择牌桌</span>
        <div class="wallet"><span class="cur coins"><i>🪙</i><b class="coin-val">0</b></span></div>
      </header>
      <div class="room-list" id="room-list"></div>
    </section>

    <!-- ===== 牌桌 ===== -->
    <section id="screen-table" class="screen hidden">
      <header id="topbar">
        <button class="back-btn" id="btn-table-back">‹ 大厅</button>
        <div class="wallet">
          <span class="cur coins"><i>🪙</i><b class="coin-val">0</b></span>
          <span class="cur diamonds"><i>💎</i><b class="diamond-val">0</b></span>
        </div>
        <div class="table-meta"><span class="blind-chip" id="blindInfo">50/100</span><span class="hand-chip" id="handInfo">第0手</span></div>
      </header>

      <main id="table-wrap">
        <div id="table">
          <div id="table-felt">
            <div id="logo-watermark">♠ ROYAL ♠</div>
            <div id="deck-anchor" aria-hidden="true"></div>
            <div id="board"></div>
            <div id="pot-display"><span class="pot-label">底池</span><span id="pot-amount">0</span></div>
            <div id="phase-banner"></div>
          </div>
          <div id="seats"></div>
          <div id="dealer-button" class="hidden">D</div>
          <div id="fx-layer"></div>
          <div id="result-banner" class="hidden"></div>
          <div id="allin-flash" class="hidden">ALL IN</div>
          <nav id="table-tools">
            <button data-panel="tableChat"><span>💬</span><b>聊天</b></button>
            <button data-panel="tableGift"><span>🎁</span><b>礼物</b></button>
            <button data-panel="tableHistory"><span>📜</span><b>牌谱</b></button>
            <button data-panel="jackpot"><span>💰</span><b>奖池</b></button>
            <button id="btn-rematch"><span>🔄</span><b>换桌</b></button>
          </nav>
        </div>
      </main>

      <footer id="controls">
        <div id="hand-strip" class="hidden"></div>
        <div id="hand-hint" class="hidden"></div>
        <div id="message-bar">点击「开始」发牌</div>
        <div id="action-area" class="hidden">
          <div id="raise-controls" class="hidden">
            <div class="raise-amount">加注到 <span id="raise-value">0</span> <input type="number" id="raise-input" inputmode="numeric" placeholder="精确" /></div>
            <input type="range" id="raise-slider" min="0" max="100" value="0" />
            <div class="quick-bets">
              <button class="quick" data-q="min">最小</button>
              <button class="quick" data-q="half">½池</button>
              <button class="quick" data-q="twothird">⅔池</button>
              <button class="quick" data-q="pot">底池</button>
              <button class="quick" data-q="allin">全下</button>
            </div>
          </div>
          <div id="action-buttons">
            <button id="btn-fold" class="act-btn fold">弃牌</button>
            <button id="btn-check" class="act-btn check">过牌</button>
            <button id="btn-call" class="act-btn call">跟注</button>
            <button id="btn-raise" class="act-btn raise">加注</button>
            <button id="btn-confirm-raise" class="act-btn confirm hidden">确认</button>
            <button id="btn-cancel-raise" class="act-btn cancel hidden">取消</button>
          </div>
        </div>
        <div id="start-area">
          <button id="btn-start" class="big-btn">开始 / 下一手</button>
        </div>
      </footer>
    </section>

  </div>

  <!-- 弹窗 -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-checkin" class="modal hidden">
      <div class="modal-head"><span>每日签到</span><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body" id="checkin-grid"></div>
      <button class="big-btn" id="checkin-claim">领取今日奖励</button>
    </div>
    <div id="modal-shop" class="modal hidden">
      <div class="modal-head"><span>商店</span><button class="modal-close" data-close>✕</button></div>
      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="coins">金币</button>
        <button class="shop-tab" data-tab="avatars">头像</button>
        <button class="shop-tab" data-tab="frames">头像框</button>
        <button class="shop-tab" data-tab="titles">称号</button>
        <button class="shop-tab" data-tab="scenes">场景</button>
        <button class="shop-tab" data-tab="vehicles">载具</button>
        <button class="shop-tab" data-tab="watches">腕表</button>
        <button class="shop-tab" data-tab="backs">牌背</button>
        <button class="shop-tab" data-tab="felts">桌布</button>
      </div>
      <div class="modal-body" id="shop-body"></div>
    </div>
    <div id="modal-redeem" class="modal hidden">
      <div class="modal-head"><span>兑换码</span><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">
        <p class="redeem-tip">输入兑换码免费领取金币 / 钻石 / 皮肤。每个码仅可使用一次。</p>
        <input type="text" id="redeem-input" placeholder="例如 RHD-C.XXXX.X-XXXXX" autocapitalize="characters" />
        <div id="redeem-msg"></div>
        <button class="big-btn" id="redeem-submit">领取</button>
        <div id="gift-codes"></div>
      </div>
    </div>
    <div id="modal-custom" class="modal hidden">
      <div class="modal-head"><span>自定义牌桌</span><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body" id="custom-body"></div>
      <button class="big-btn" id="custom-start">进入牌桌</button>
    </div>
    <div id="modal-wheel" class="modal hidden">
      <div class="modal-head"><span>每日幸运转盘</span><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">
        <div class="wheel-wrap"><div id="wheel" class="wheel"></div><div class="wheel-pin">▼</div></div>
      </div>
      <button class="big-btn" id="wheel-spin">免费抽一次</button>
    </div>
    <div id="modal-panel" class="modal hidden">
      <div class="modal-head"><span id="panel-title">详情</span><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body" id="panel-body"></div>
    </div>
    <div id="modal-toast" class="toast hidden"></div>
  </div>

  <script src="codec.js"></script>
  <script src="skins.js"></script>
  <script src="store.js"></script>
  <script src="sound.js"></script>
  <script src="music.js"></script>
  <script src="voice.js"></script>
  <script src="fx.js"></script>
  <script src="social.js"></script>
  <script src="poker.js"></script>
  <script src="ai.js"></script>
  <script src="game.js"></script>
  <!-- 规则核心(reducer)+ 绞杀者适配器：依赖序加载，挂到 window.RHCore -->
  <script src="core/poker/SeededRng.js"></script>
  <script src="core/poker/types.js"></script>
  <script src="core/poker/Card.js"></script>
  <script src="core/poker/Deck.js"></script>
  <script src="core/poker/HandEvaluator.js"></script>
  <script src="core/poker/HandComparator.js"></script>
  <script src="core/poker/SidePot.js"></script>

  <script src="core/poker/LegalActions.js"></script>
  <script src="core/poker/HandHistory.js"></script>
  <script src="core/poker/GameReducer.js"></script>
  <script src="core/poker/Equity.js"></script>
  <script src="core/poker/selectors.js"></script>
  <script src="core/ai/types.js"></script>
  <script src="core/ai/BotProfiles.js"></script>
  <script src="core/ai/BotProfile.js"></script>
  <script src="core/ai/PreflopMatrix.js"></script>

  <script src="core/ai/EquityCalculator.js"></script>
  <script src="core/ai/HandClassDescriber.js"></script>
  <script src="core/ai/BoardTextureDescriber.js"></script>
  <script src="core/ai/ActionHistoryFormatter.js"></script>
  <script src="core/ai/DecisionReasonFormatter.js"></script>
  <script src="core/ai/PostflopHeuristics.js"></script>
  <script src="core/ai/PokerBrain.js"></script>
  <script src="core/ai/OpponentModel.js"></script>
  <script src="core/ai/BotDecisionEngine.js"></script>
  <script src="game/table/GameAdapter.js"></script>
  <script src="services/EventBus.js"></script>
  <script src="services/AudioManager.js"></script>
  <script src="services/GameFeelDirector.js"></script>
  <script src="gamefeel/GameFeelEvent.js"></script>
  <script src="gamefeel/GameFeelConfig.js"></script>
  <script src="gamefeel/TableAnimationQueue.js"></script>
  <script src="gamefeel/HapticDirector.js"></script>
  <script src="gamefeel/ChipFlyAnimator.js"></script>
  <script src="gamefeel/CardSlot.js"></script>
  <script src="gamefeel/CardDealAnimator.js"></script>
  <script src="gamefeel/PotWinAnimator.js"></script>
  <script src="gamefeel/HighlightDirector.js"></script>
  <script src="gamefeel/GameFeelDirector.js"></script>
  <script src="view/table/SeatView.js"></script>
  <script src="view/table/ActionPanel.js"></script>
  <script src="view/table/PlayerViewModel.js"></script>
  <script src="view/table/CardRow.js"></script>
  <script src="view/table/layers/_base.js"></script>
  <script src="view/table/layers/TableBackgroundLayer.js"></script>
  <script src="view/table/layers/TableFeltLayer.js"></script>
  <script src="view/table/layers/SeatLayer.js"></script>
  <script src="view/table/layers/DealerButtonLayer.js"></script>
  <script src="view/table/layers/CommunityCardLayer.js"></script>
  <script src="view/table/layers/PotLayer.js"></script>
  <script src="view/table/layers/BetChipLayer.js"></script>
  <script src="view/table/layers/PlayerHandLayer.js"></script>
  <script src="view/table/layers/ActionPanelLayer.js"></script>
  <script src="view/table/layers/TrainingAssistantLayer.js"></script>
  <script src="view/table/layers/ChatEmojiLayer.js"></script>
  <script src="view/table/layers/GiftAnimationLayer.js"></script>
  <script src="view/table/layers/HistoryLayer.js"></script>
  <script src="view/table/layers/ModalLayer.js"></script>
  <script src="view/table/TableScene.js"></script>
  <script src="controllers/DealController.js"></script>
  <script src="controllers/ShowdownController.js"></script>
  <script src="controllers/SettlementController.js"></script>
  <script src="controllers/ActionController.js"></script>
  <script src="core/Lessons.js"></script>
  <script src="router.js"></script>
  <script src="ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
