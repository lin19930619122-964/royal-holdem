<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>皇室德州 · 真人对战</title>
  <meta name="theme-color" content="#0a1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    #onlinebar { display:flex; align-items:center; justify-content:space-between; padding:6px 14px; border-bottom:1px solid rgba(245,207,107,.12); font-size:12px; color:#cfe7d8; }
    #onlinebar .left { display:flex; gap:8px; align-items:center; }
    #conn-state { padding:3px 10px; border-radius:12px; background:rgba(0,0,0,.35); }
    #conn-state.ok { color:#5be08a; } #conn-state.bad { color:#ff8a8a; }
    .host-ctl { display:flex; gap:8px; }
    .host-ctl button { background:rgba(245,207,107,.18); border:1px solid var(--gold); color:var(--gold); border-radius:9px; padding:6px 12px; font-weight:700; font-size:12px; }
    #timer-wrap { position:absolute; left:50%; bottom:2%; transform:translateX(-50%); width:60%; height:6px; background:rgba(0,0,0,.4); border-radius:4px; overflow:hidden; display:none; }
    #timer-bar { height:100%; width:100%; background:linear-gradient(90deg,#5be08a,var(--gold)); transition:width .25s linear; }
    #join-overlay { position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.75); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; }
    #join-card { width:100%; max-width:380px; background:linear-gradient(180deg,#163123,#0a1410); border:1.5px solid rgba(245,207,107,.4); border-radius:18px; padding:22px; text-align:center; }
    #join-card h2 { color:var(--gold); margin-bottom:6px; font-size:20px; }
    #join-card p { color:#bfe6cf; font-size:12px; margin-bottom:16px; }
    #join-name { width:100%; padding:12px; border-radius:10px; border:1px solid rgba(245,207,107,.4); background:rgba(0,0,0,.4); color:#fff; font-size:15px; text-align:center; margin-bottom:14px; }
    .back-link { position:absolute; left:12px; }
    /* 大厅房间列表 */
    #lobby-list { display:flex; flex-direction:column; gap:10px; margin-top:14px; max-height:50vh; overflow-y:auto; }
    .room-card2 { display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; border:1px solid rgba(245,207,107,.25); background:rgba(255,255,255,.04); }
    .room-card2 .rinfo { flex:1; text-align:left; } .room-card2 .rname { color:#fff; font-weight:800; font-size:14px; }
    .room-card2 .rdesc { color:#9fc4ae; font-size:11px; margin-top:2px; }
    .room-card2 button { border:none; border-radius:9px; padding:7px 11px; font-weight:800; font-size:12px; margin-left:4px; }
    .r-sit { background:linear-gradient(180deg,var(--gold-lt),var(--gold-deep)); color:#3a2400; }
    .r-spec { background:rgba(255,255,255,.1); color:#cfe7d8; }
    #btn-lobby { background:rgba(245,207,107,.18); border:1px solid var(--gold); color:var(--gold); border-radius:9px; padding:4px 10px; font-weight:700; font-size:12px; }
    /* 社交条 */
    #mp-social { padding:4px 10px 6px; border-top:1px solid rgba(245,207,107,.12); }
    #chat-log { max-height:74px; overflow-y:auto; font-size:12px; color:#dfeee6; line-height:1.5; margin-bottom:5px; }
    #chat-log .ci-seat { color:var(--gold-lt); font-weight:800; } #chat-log .ci-sys { color:#ffb454; }
    #social-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    #chat-input { flex:1; min-width:90px; padding:7px 10px; border-radius:9px; border:1px solid rgba(245,207,107,.3); background:rgba(0,0,0,.35); color:#fff; font-size:13px; }
    #social-row button { border:1px solid rgba(245,207,107,.25); background:rgba(255,255,255,.05); color:#eafff1; border-radius:9px; padding:6px 9px; font-size:14px; font-weight:700; }
    #report-pick { display:none; flex-direction:column; gap:6px; margin-top:6px; }
    #report-pick button { background:rgba(255,90,90,.15); border-color:rgba(255,120,120,.4); color:#ffb0b0; font-size:12px; }
    .emote-fly { position:absolute; z-index:38; font-size:30px; pointer-events:none; transform:translate(-50%,-50%); animation:emoteUp 1.6s ease-out forwards; }
    @keyframes emoteUp { 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} 100%{opacity:0;transform:translate(-50%,-160%) scale(1)} }
    /* 好友 / 俱乐部面板 */
    #social-overlay { position:fixed; inset:0; z-index:130; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:18px; }
    #social-overlay.hidden { display:none; }
    #social-card { width:100%; max-width:380px; max-height:84vh; overflow-y:auto; background:linear-gradient(180deg,#163123,#0a1410); border:1.5px solid rgba(245,207,107,.4); border-radius:16px; padding:16px; }
    .soc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .soc-head b { color:var(--gold); font-size:17px; }
    #soc-close { background:none; border:none; color:#cfe7d8; font-size:18px; }
    .soc-sec { margin-bottom:12px; } .soc-t { color:#bfe6cf; font-size:12px; font-weight:700; margin-bottom:5px; }
    .my-code { font-size:20px; font-weight:900; letter-spacing:2px; color:var(--gold-lt); background:rgba(0,0,0,.35); border-radius:8px; padding:8px; text-align:center; }
    .soc-row { display:flex; gap:6px; } .soc-row input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid rgba(245,207,107,.3); background:rgba(0,0,0,.35); color:#fff; font-size:14px; }
    .soc-row button, #club-box button { border:none; border-radius:8px; padding:8px 12px; font-weight:800; font-size:13px; background:linear-gradient(180deg,var(--gold-lt),var(--gold-deep)); color:#3a2400; }
    .soc-list { display:flex; flex-direction:column; gap:6px; }
    .soc-friend { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px; background:rgba(255,255,255,.04); font-size:13px; color:#eafff1; }
    .soc-friend .dot { width:8px; height:8px; border-radius:50%; background:#555; } .soc-friend .dot.on { background:#5fd38a; box-shadow:0 0 6px #5fd38a; }
    .soc-friend .nm { flex:1; } .soc-friend .st { font-size:11px; color:#9fc4ae; }
    #club-box .club-mem { display:flex; align-items:center; gap:8px; font-size:13px; color:#eafff1; padding:4px 0; }
    .soc-msg { color:#ffb454; font-size:12px; min-height:16px; text-align:center; }
    #btn-friends { background:rgba(245,207,107,.18); border:1px solid var(--gold); color:var(--gold); border-radius:9px; padding:4px 10px; font-weight:700; font-size:12px; }
  </style>
</head>
<body>
  <div id="app">
    <header id="onlinebar">
      <div class="left">
        <a class="cur" href="index.html" style="text-decoration:none;color:var(--gold)">‹ 返回</a>
        <span id="conn-state" class="bad">连接中…</span>
      </div>
      <div class="left">
        <button id="btn-lobby">大厅</button>
        <button id="btn-friends">好友</button>
        <button id="btn-sit" class="hidden">入座</button>
        <span id="seatInfo">座位 -/6</span>
        <span id="blindInfo">50/100</span>
      </div>
    </header>

    <main id="table-wrap">
      <div id="table">
        <div id="table-felt">
          <div id="logo-watermark">♠ ROYAL ♠</div>
          <div id="board"></div>
          <div id="pot-display"><span class="pot-label">底池</span><span id="pot-amount">0</span></div>
          <div id="phase-banner"></div>
        </div>
        <div id="seats"></div>
        <div id="dealer-button" class="hidden">D</div>
        <div id="fx-layer"></div>
        <div id="timer-wrap"><div id="timer-bar"></div></div>
      </div>
    </main>

    <footer id="controls">
      <div id="mp-social">
        <div id="chat-log"></div>
        <div id="social-row">
          <input type="text" id="chat-input" maxlength="80" placeholder="说点什么…" />
          <button id="chat-send">发送</button>
          <button class="emo" data-emo="😀">😀</button>
          <button class="emo" data-emo="😎">😎</button>
          <button class="emo" data-emo="😭">😭</button>
          <button class="emo" data-emo="👍">👍</button>
          <button id="btn-report">🚩</button>
        </div>
        <div id="report-pick"></div>
      </div>
      <div id="message-bar">连接服务器中…</div>
      <div id="host-area" class="host-ctl hidden">
        <button id="btn-addbot">+ 机器人</button>
        <button id="btn-startmp">开始本手</button>
      </div>
      <div id="action-area" class="hidden">
        <div id="raise-controls" class="hidden">
          <div class="raise-amount">加注到 <span id="raise-value">0</span></div>
          <input type="range" id="raise-slider" min="0" max="100" value="0" />
          <div class="quick-bets">
            <button class="quick" data-q="min">最小</button>
            <button class="quick" data-q="half">½池</button>
            <button class="quick" data-q="pot">底池</button>
            <button class="quick" data-q="allin">全下</button>
          </div>
        </div>
        <div id="action-buttons">
          <button id="btn-fold" class="act-btn fold">弃牌</button>
          <button id="btn-check" class="act-btn check">过牌</button>
          <button id="btn-call" class="act-btn call">跟注</button>
          <button id="btn-raise" class="act-btn raise">加注</button>
          <button id="btn-confirm-raise" class="act-btn confirm hidden">确认</button>
          <button id="btn-cancel-raise" class="act-btn cancel hidden">取消</button>
        </div>
      </div>
    </footer>
  </div>

  <div id="join-overlay">
    <div id="join-card">
      <h2>真人对战 · 大厅</h2>
      <p>同一 Tailnet 的朋友打开本页即可同桌。先取昵称，再选房间入座或旁观；人不够点「+机器人」补位。</p>
      <input type="text" id="join-name" placeholder="输入你的昵称" maxlength="8" />
      <button class="big-btn" id="join-go">进入大厅</button>
      <div id="lobby-list"></div>
    </div>
  </div>

  <div id="social-overlay" class="hidden">
    <div id="social-card">
      <div class="soc-head"><b>好友 · 俱乐部</b><button id="soc-close">✕</button></div>
      <div class="soc-sec"><div class="soc-t">我的好友码（发给朋友互加）</div><div id="my-code" class="my-code">—</div></div>
      <div class="soc-sec"><div class="soc-t">添加好友</div><div class="soc-row"><input type="text" id="friend-code" placeholder="输入对方好友码" maxlength="12" /><button id="friend-add">添加</button></div></div>
      <div class="soc-sec"><div class="soc-t">好友列表</div><div id="friend-list" class="soc-list"></div></div>
      <div class="soc-sec"><div class="soc-t">俱乐部</div><div id="club-box"></div></div>
      <div id="soc-msg" class="soc-msg"></div>
    </div>
  </div>

  <script src="poker.js"></script>
  <script src="skins.js"></script>
  <script src="store.js"></script>
  <script src="codec.js"></script>
  <script src="sound.js"></script>
  <script src="music.js"></script>
  <script src="fx.js"></script>
  <script src="online.js"></script>
</body>
</html>
